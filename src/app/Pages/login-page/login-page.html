<form>
    <input name="username" [(ngModel)]="loginData.username" type="text" placeholder="Username">
    <input name="password" [(ngModel)]="loginData.password" type="password" placeholder="Password">
    <input name="RememberMe"  type="checkbox" [(ngModel)]="loginData.RememberMe">
    <button (click)="Check()">Login</button>
</form>
@if(message!=''){
    <div>
        {{message}}
    </div>
}
